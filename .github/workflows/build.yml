name: Build LaTeX document
on: [push]
jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
      #- name: Lint
      #  uses: j2kun/chktex-action@v2
      #  with:
      #    lint-all: true
      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: ./src/docs
          latexmk_use_lualatex: true
          root_file: Banff.tex
          os: debian          # Changes the base image to Debian
          pre_compile: |      # Installs the fonts natively via apt
            apt-get update
            apt-get install -y fonts-cmu fonts-unifont fonts-wqy-zenhei fonts-freefont-ttf fonts-freefont-otf
            luaotfload-tool --update
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode --shell-escape
        env:
          TEXINPUTS: ".:.//:"
      - name: Upload PDF file
        uses: actions/upload-artifact@v4
        with:
          name: PDF
          path: ./src/docs/Banff.pdf
